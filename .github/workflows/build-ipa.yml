name: build-ipa

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier"
        default: "dev.linuxrunner.app"
        required: false
      xcode_path:
        description: "Developer dir (empty = newest Xcode on the runner)"
        default: ""
        required: false
      artifact_suffix:
        description: "Extra suffix for the artifact name (optional)"
        default: ""
        required: false
  push:
    tags:
      - "v*"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 180
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'dev.linuxrunner.app' }}
      XCODE_PATH: ${{ inputs.xcode_path }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          # Default: the runner's selected Xcode (26.6 / iPhoneOS 26.5 today).
          # Pass xcode_path (e.g. /Applications/Xcode_27.app/Contents/Developer)
          # to build against a newer SDK.
          if [ -n "$XCODE_PATH" ] && [ -d "$XCODE_PATH" ]; then
            echo "DEVELOPER_DIR=$XCODE_PATH" >> "$GITHUB_ENV"
          fi
          ls -d /Applications/Xcode*.app 2>/dev/null || true

      - name: Toolchain report
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          uname -m
          sysctl -n hw.memsize hw.ncpu
          df -h /

      - name: Install build dependencies
        run: |
          brew install meson ninja cmake lld pkg-config || true
          for t in meson ninja cmake python3 pkg-config ld.lld; do
            printf '%-10s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      - name: Verify GUI support manifest
        run: python3 scripts/generate-gui-support-manifest.py --check

      - name: Bootstrap prerequisites check
        run: scripts/bootstrap-macos.sh

      - name: Build unsigned IPA
        run: |
          export PATH="$(brew --prefix)/opt/lld/bin:$PATH"
          scripts/build-ipa.sh --unsigned 2>&1 | tee build-ipa.log

      - name: Verify IPA
        run: |
          set -o pipefail
          python3 scripts/verify-ipa.py build/releases 2>&1 | tee verify.log
          ls -lh build/releases/

      - name: Collect logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs${{ inputs.artifact_suffix }}
          path: |
            build-ipa.log
            verify.log
            build/releases/*.log
            build/releases/*.json
            build/releases/*.txt
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LinuxRunner-unsigned-ipa${{ inputs.artifact_suffix }}
          path: |
            build/releases/*.ipa
            build/releases/*.sha256
            build/releases/*.entitlements.plist
          if-no-files-found: error

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/releases/*.ipa
          generate_release_notes: true
